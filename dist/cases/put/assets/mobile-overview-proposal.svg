<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Proposed mobile overview for PUT parcel tracking</title>
  <desc id="desc">Editable SVG exploration made after the Figma desktop case. It is not in the linked Figma source.</desc>
  <style>
    text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#12203a}
    .muted{fill:#65738d}.blue{fill:#1f5eff}.white{fill:#fff}.small{font-size:12px}.label{font-size:11px;font-weight:700;letter-spacing:1.2px}.body{font-size:14px}.bold{font-weight:700}.title{font-size:25px;font-weight:750;letter-spacing:-.7px}
  </style>
  <rect width="390" height="844" rx="30" fill="#f3f6fc"/>
  <path d="M0 30Q0 0 30 0h330q30 0 30 30v82H0Z" fill="#fff"/>
  <rect x="22" y="32" width="36" height="36" rx="11" fill="#1f5eff"/>
  <path d="M33 57V43h14v14" fill="none" stroke="#fff" stroke-width="3"/>
  <text x="70" y="57" font-size="20" font-weight="800">ПУТЬ</text>
  <circle cx="352" cy="50" r="20" fill="#e8efff"/>
  <text x="345" y="57" font-size="17" font-weight="700" class="blue">M</text>
  <text x="22" y="145" class="label muted">MY PARCELS</text>
  <text x="22" y="178" class="title">Know the next step.</text>
  <text x="22" y="201" class="body muted">Status, timing, and pickup in one place.</text>
  <rect x="22" y="222" width="346" height="91" rx="18" fill="#fff"/>
  <text x="38" y="248" class="small bold">Track by parcel number</text>
  <rect x="38" y="259" width="238" height="40" rx="10" fill="#f2f5fb"/>
  <text x="51" y="284" class="small muted">e.g. PT-24810</text>
  <rect x="284" y="259" width="68" height="40" rx="10" fill="#1f5eff"/>
  <text x="297" y="284" class="small bold white">Track</text>
  <text x="22" y="350" class="label muted">NEXT PICKUP</text>
  <rect x="22" y="367" width="346" height="192" rx="20" fill="#1f5eff"/>
  <text x="42" y="398" class="label white">READY FOR PICKUP</text>
  <text x="42" y="436" font-size="23" font-weight="750" class="white">Today, by 8:00 PM</text>
  <text x="42" y="461" class="body white">PT-24810 · Books</text>
  <text x="42" y="484" class="small white">12 Primernaia St · 09:00–20:00</text>
  <rect x="42" y="504" width="306" height="40" rx="10" fill="#fff"/>
  <text x="112" y="529" class="small bold blue">View pickup code  →</text>
  <text x="22" y="592" font-size="18" font-weight="750">Active parcels</text>
  <text x="326" y="591" class="small blue">History</text>
  <rect x="22" y="606" width="346" height="87" rx="16" fill="#fff"/>
  <rect x="39" y="624" width="83" height="22" rx="11" fill="#e9efff"/>
  <text x="56" y="639" class="small bold blue">IN TRANSIT</text>
  <text x="39" y="667" class="body bold">PT-24832 · Headphones</text>
  <text x="282" y="667" class="small muted">24 Sep  →</text>
  <rect x="22" y="705" width="346" height="82" rx="16" fill="#fff"/>
  <rect x="39" y="720" width="76" height="22" rx="11" fill="#e9efff"/>
  <text x="49" y="735" class="small bold blue">SORTING</text>
  <text x="39" y="763" class="body bold">PT-24867 · Backpack</text>
  <text x="287" y="763" class="small muted">25 Sep  →</text>
  <path d="M0 790h390v54H0Z" fill="#fff"/>
  <text x="46" y="820" class="small bold blue">Parcels</text>
  <text x="169" y="820" class="small muted">Addresses</text>
  <text x="290" y="820" class="small muted">Support</text>
</svg>
