<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Proposed mobile pickup detail for PUT parcel tracking</title>
  <desc id="desc">Editable SVG exploration made after the Figma desktop case. It is not in the linked Figma source.</desc>
  <style>
    text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#12203a}
    .muted{fill:#65738d}.blue{fill:#1f5eff}.white{fill:#fff}.small{font-size:12px}.label{font-size:11px;font-weight:700;letter-spacing:1px}.body{font-size:14px}.bold{font-weight:700}
  </style>
  <rect width="390" height="844" rx="30" fill="#f3f6fc"/>
  <path d="M0 30Q0 0 30 0h330q30 0 30 30v78H0Z" fill="#fff"/>
  <text x="22" y="53" font-size="27" class="blue">←</text>
  <text x="60" y="55" font-size="17" font-weight="750">Pickup details</text>
  <text x="337" y="54" font-size="22" class="muted">⋯</text>
  <text x="22" y="140" class="label muted">PT-24810 · BOOKS</text>
  <text x="22" y="175" font-size="26" font-weight="750">Your parcel is here.</text>
  <rect x="22" y="195" width="346" height="214" rx="20" fill="#1f5eff"/>
  <text x="42" y="229" class="label white">READY FOR PICKUP</text>
  <text x="42" y="265" font-size="21" font-weight="750" class="white">Collect today</text>
  <text x="42" y="290" class="body white">Open until 8:00 PM</text>
  <rect x="42" y="313" width="306" height="75" rx="13" fill="#fff"/>
  <text x="58" y="337" class="label muted">PICKUP CODE</text>
  <text x="58" y="369" font-size="29" font-weight="800" class="blue" letter-spacing="2">846 219</text>
  <rect x="22" y="425" width="346" height="123" rx="18" fill="#fff"/>
  <text x="42" y="453" class="small bold">Pickup point</text>
  <text x="42" y="480" class="body">12 Primernaia Street</text>
  <text x="42" y="501" class="small muted">Every day · 09:00–20:00</text>
  <text x="42" y="528" class="small bold blue">Open route ↗</text>
  <rect x="22" y="564" width="346" height="183" rx="18" fill="#fff"/>
  <text x="42" y="594" font-size="17" font-weight="750">Before collecting</text>
  <circle cx="53" cy="622" r="12" fill="#e9efff"/>
  <text x="49" y="627" class="small bold blue">1</text>
  <text x="75" y="627" class="body">Show the code to staff</text>
  <circle cx="53" cy="661" r="12" fill="#e9efff"/>
  <text x="49" y="666" class="small bold blue">2</text>
  <text x="75" y="666" class="body">Check the package</text>
  <circle cx="53" cy="700" r="12" fill="#e9efff"/>
  <text x="49" y="705" class="small bold blue">3</text>
  <text x="75" y="705" class="body">Confirm receipt</text>
  <text x="22" y="779" class="small muted">Illustrative address and code · concept only</text>
  <path d="M0 790h390v54H0Z" fill="#fff"/>
  <text x="46" y="820" class="small bold blue">Parcels</text>
  <text x="169" y="820" class="small muted">Addresses</text>
  <text x="290" y="820" class="small muted">Support</text>
</svg>
